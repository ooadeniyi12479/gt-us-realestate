services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gtext
      POSTGRES_USER: gtext
      POSTGRES_PASSWORD: gtext_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtext"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gtext:gtext_dev_password@db:5432/gtext
      CORS_ORIGINS: http://localhost:8080
      REFRESH_HOURS: ${REFRESH_HOURS:-6}
      STALE_HOURS: ${STALE_HOURS:-18}
      RENTCAST_API_KEY: ${RENTCAST_API_KEY:-}
      RENTCAST_BASE_URL: ${RENTCAST_BASE_URL:-https://api.rentcast.io/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      OFFMARKET_API_URL: ${OFFMARKET_API_URL:-}
      OFFMARKET_API_TOKEN: ${OFFMARKET_API_TOKEN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "8080:80"
volumes:
  postgres_data:
